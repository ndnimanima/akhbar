<!doctype html>
<html lang="fa" dir="rtl" data-theme="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1120">
  <title>روزنه · ورود</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css?v=1.04.4">
  <style>
    /* The sign-in card keeps its critical layout inline on purpose: even if the
       stylesheet is cached from an older release, the form still lines up. */
    body { display: grid; place-items: center; min-height: 100vh; padding: 22px; }
    .login-wrap { width: min(404px, 100%); }
    .login-brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 22px; }
    .login-brand .mark { width: 54px; height: 54px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); }
    .login-brand .mark img { width: 100%; height: 100%; }
    .login-brand .txt { display: flex; flex-direction: column; line-height: 1.2; }
    .login-brand .txt strong { font-size: 20px; font-weight: 800; letter-spacing: .2px; }
    .login-brand .txt small { font-size: 11px; color: var(--text-mute); }
    .login-card { padding: 24px 22px 20px; }
    .login-card h1 { margin: 0 0 3px; font-size: 15px; font-weight: 750; }
    .login-card p.sub { margin: 0 0 18px; font-size: 11.5px; color: var(--text-mute); }
    .login-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
    .login-foot .ver {
      font-family: var(--mono); font-size: 10px; color: var(--text-mute); direction: ltr;
      background: transparent; border: 1px solid var(--border, rgba(255,255,255,.12));
      border-radius: 99px; padding: 3px 9px; line-height: 1.6;
    }
    .err { color: var(--bad); font-size: 11.8px; min-height: 17px; margin-top: 8px; }

    /* password field: the eye always sits on the outer edge and the input always
       reserves exactly that much room, in RTL and LTR alike */
    .pw-wrap { position: relative; display: block; }
    .pw-wrap input { direction: ltr; text-align: left; padding-left: 12px; padding-right: 46px; }
    .pw-eye {
      position: absolute; top: 50%; transform: translateY(-50%);
      right: 8px; left: auto;
      width: 34px; height: 34px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 9px; background: transparent;
      color: var(--text-mute); cursor: pointer; line-height: 0;
    }
    [dir="rtl"] .pw-wrap input { padding-left: 46px; padding-right: 12px; }
    [dir="rtl"] .pw-eye { left: 8px; right: auto; }
    .pw-eye:hover { color: var(--text); }
    .pw-eye svg { width: 16px; height: 16px; display: block; }

    /* submit: never rely on a class that a stale stylesheet may not have */
    #submitBtn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-width: 0; height: 44px; margin-top: 2px;
      border-radius: 11px; border: 0; cursor: pointer;
      font: inherit; font-size: 13.5px; font-weight: 700;
      color: var(--accent-ink, #04121f);
      background: linear-gradient(135deg, var(--accent, #2dd4bf), var(--accent-2, #3b82f6));
      box-sizing: border-box;
    }
    #submitBtn[disabled] { opacity: .55; pointer-events: none; }

    .switchers { display: flex; gap: 6px; }
    .switchers .tool {
      display: inline-flex; align-items: center; justify-content: center;
      height: 30px; min-width: 34px; padding: 0 8px;
      border-radius: 9px; border: 1px solid var(--border, rgba(255,255,255,.14));
      background: var(--panel, transparent); color: var(--text-dim, currentColor);
      font: inherit; font-size: 11px; cursor: pointer; line-height: 1;
    }
    .switchers .tool svg { width: 14px; height: 14px; display: block; }
    .switchers .tool.lang { font-family: var(--mono); letter-spacing: .4px; }
    .switchers .tool:hover { color: var(--text, #fff); }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .login-card { padding: 20px 16px 16px; }
      .login-brand { margin-bottom: 16px; }
    }
    @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-3px)} 40%,60%{transform:translateX(3px)} }
    .shake { animation: shake .45s; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <span class="mark"><img src="/assets/logo.svg?v=1.04" alt="Rozaneh"></span>
      <span class="txt"><strong id="brandName">روزنه</strong><small id="brandTag">از سرخط خبر تا کانال، خودکار</small></span>
    </div>

    <form class="card login-card" id="loginForm" autocomplete="on" novalidate>
      <h1 id="formTitle">ورود به پنل</h1>
      <p class="sub" id="formSub">رمز عبور مدیریت را وارد کنید</p>

      <div class="field">
        <label for="password" id="pwLabel">رمز عبور</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus dir="ltr" placeholder="••••••••">
          <button type="button" class="pw-eye" id="pwEye" aria-label="نمایش رمز" title="نمایش رمز">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn primary block" type="submit" id="submitBtn">ورود</button>
      <div class="err" id="err" role="alert"></div>

      <div class="login-foot">
        <div class="switchers">
          <button type="button" class="tool lang" id="langBtn">EN</button>
          <button type="button" class="tool" id="themeBtn" aria-label="theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </div>
        <span class="ver">Rozaneh v1.04</span>
      </div>
    </form>
  </div>

  <script src="/assets/i18n.js?v=1.04.6"></script>
  <script>
  (function () {
    "use strict";
    var LS_LANG = "rozaneh.lang", LS_THEME = "rozaneh.theme";
    var lang = localStorage.getItem(LS_LANG) || "fa";
    var theme = localStorage.getItem(LS_THEME) || "slate";
    var meta = null;
    var EYE_OPEN = '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
    var EYE_OFF = '<path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-2.5 3.3"/><path d="M6.6 6.9A17 17 0 0 0 2 12s4 7 10 7a10 10 0 0 0 4.1-.8"/>';

    function apply() {
      var html = document.documentElement;
      html.setAttribute("lang", lang);
      html.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
      html.setAttribute("data-theme", theme);
      document.title = (lang === "fa" ? "روزنه · ورود" : "Rozaneh · Sign in");
      document.getElementById("brandName").textContent = meta ? (lang === "fa" ? meta.app_fa : meta.app) : (lang === "fa" ? "روزنه" : "Rozaneh");
      document.getElementById("brandTag").textContent = lang === "fa" ? "از سرخط خبر تا کانال، خودکار" : "From headline to channel, automatically";
      document.getElementById("formTitle").textContent = lang === "fa" ? "ورود به پنل" : "Sign in to the panel";
      document.getElementById("formSub").textContent = lang === "fa" ? "رمز عبور مدیریت را وارد کنید" : "Enter the administration password";
      document.getElementById("pwLabel").textContent = lang === "fa" ? "رمز عبور" : "Password";
      document.getElementById("submitBtn").textContent = lang === "fa" ? "ورود" : "Sign in";
      document.getElementById("langBtn").textContent = lang === "fa" ? "EN" : "فا";
      document.getElementById("pwEye").setAttribute("title", lang === "fa" ? "نمایش رمز" : "Show password");
      var v = document.querySelector(".ver");
      if (v && meta) v.textContent = "Rozaneh v" + meta.version;
    }

    document.getElementById("langBtn").addEventListener("click", function () {
      lang = lang === "fa" ? "en" : "fa";
      localStorage.setItem(LS_LANG, lang);
      apply();
    });
    document.getElementById("themeBtn").addEventListener("click", function () {
      theme = theme === "slate" ? "amber" : "slate";
      localStorage.setItem(LS_THEME, theme);
      apply();
    });

    var pw = document.getElementById("password");
    var eye = document.getElementById("pwEye");
    eye.addEventListener("click", function () {
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      eye.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (show ? EYE_OFF : EYE_OPEN) + "</svg>";
      eye.setAttribute("aria-pressed", show ? "true" : "false");
      pw.focus();
    });

    document.getElementById("loginForm").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var err = document.getElementById("err");
      var btn = document.getElementById("submitBtn");
      var card = document.querySelector(".login-card");
      var value = pw.value;
      err.textContent = "";
      if (!value) {
        err.textContent = (I18N[lang] || I18N.fa)["err.password_required"] || (lang === "fa" ? "رمز عبور را وارد کنید" : "Enter the password");
        pw.focus();
        return;
      }
      btn.disabled = true;
      try {
        var res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: value })
        });
        if (!res.ok) {
          var data = null;
          try { data = await res.json(); } catch (e) {}
          var T = I18N[lang] || I18N.fa;
          var code = (data && data.detail) || "unknown";
          err.textContent = T["err." + code] || code;
          card.classList.add("shake");
          setTimeout(function () { card.classList.remove("shake"); }, 500);
          btn.disabled = false;
          return;
        }
        location.replace("/");
      } catch (e) {
        err.textContent = (I18N[lang] || I18N.fa)["err.network_error"];
        btn.disabled = false;
      }
    });

    fetch("/api/meta").then(function (r) { return r.json(); }).then(function (data) {
      meta = data;
      if (!localStorage.getItem(LS_LANG) && data.defaults && data.defaults.language) { lang = data.defaults.language; }
      if (!localStorage.getItem(LS_THEME) && data.defaults && data.defaults.theme) { theme = data.defaults.theme; }
      if (data.authenticated) { location.replace("/"); return; }
      apply();
    }).catch(function () { apply(); });

    apply();
  })();
  </script>
</body>
</html>
