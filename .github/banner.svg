<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="NewsRail — news to channel automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7d3"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#5ee7d3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5ee7d3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- logo mark -->
  <g transform="translate(78 92) scale(2.1)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0b0e15" stroke="url(#acc)" stroke-width="2.5"/>
    <path d="M18 45V19" stroke="url(#acc)" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 25h14a5 5 0 0 1 0 10H24" stroke="url(#acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="43" cy="21" r="3" fill="#5ee7d3"/>
    <circle cx="43" cy="45" r="3" fill="#7c9cff"/>
    <path d="M43 26v14" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  </g>

  <text x="248" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#eef1f8" letter-spacing="-1">NewsRail</text>
  <text x="250" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8d96ab">News  →  topics  →  translate  →  your channel, on a schedule.</text>

  <!-- feature chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d2e6">
    <rect x="248" y="212" width="126" height="34" rx="17" fill="#5ee7d3" fill-opacity="0.12" stroke="#5ee7d3" stroke-opacity="0.3"/>
    <text x="311" y="234" text-anchor="middle" fill="#b9f7e2">RSS / Atom</text>
    <rect x="386" y="212" width="132" height="34" rx="17" fill="#7c9cff" fill-opacity="0.12" stroke="#7c9cff" stroke-opacity="0.3"/>
    <text x="452" y="234" text-anchor="middle" fill="#cfe0ff">Topic filter</text>
    <rect x="530" y="212" width="120" height="34" rx="17" fill="#b48bff" fill-opacity="0.12" stroke="#b48bff" stroke-opacity="0.3"/>
    <text x="590" y="234" text-anchor="middle" fill="#dfd3ff">Translate</text>
    <rect x="662" y="212" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="737" y="234" text-anchor="middle" fill="#c9d2e6">Telegram · Bale</text>
    <rect x="824" y="212" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="884" y="234" text-anchor="middle" fill="#c9d2e6">FastAPI</text>
    <rect x="956" y="212" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="1016" y="234" text-anchor="middle" fill="#c9d2e6">Railway</text>
  </g>

  <!-- decorative rail -->
  <line x1="78" y1="268" x2="1122" y2="268" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="248" cy="268" r="3.5" fill="#5ee7d3"/>
  <circle cx="640" cy="268" r="3.5" fill="#7c9cff"/>
  <circle cx="1016" cy="268" r="3.5" fill="#b48bff"/>
</svg>
