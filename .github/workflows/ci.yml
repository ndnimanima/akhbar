name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q app main.py

      - name: Install ffmpeg for video regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Video memory and frame regression tests
        run: python -m unittest discover -s tests -v

      - name: Frontend syntax + assets
        run: |
          node --check static/assets/app.js
          node --check static/assets/i18n.js
          node --check static/assets/video.js
          node tests/test_video_poll.cjs
          npm install --prefix "$RUNNER_TEMP/akhbar-js-tests" --no-save --no-package-lock jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/akhbar-js-tests/node_modules" node tests/test_modal.cjs
          NODE_PATH="$RUNNER_TEMP/akhbar-js-tests/node_modules" node tests/test_video_settings.cjs
          for f in static/index.html static/login.html static/assets/style.css static/assets/logo.svg; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Version is consistent everywhere
        run: |
          python - <<'PY'
          import re, pathlib
          version = re.search(r'VERSION = "([\d.]+)"', pathlib.Path("app/config.py").read_text()).group(1)
          for page in ("static/index.html", "static/login.html"):
              html = pathlib.Path(page).read_text()
              assert f"?v={version}" in html, f"{page} does not cache-bust assets with ?v={version}"
          print("version", version, "is wired through both pages")
          PY

      - name: Messenger rules are declared
        run: |
          python - <<'PY'
          from app import publish
          for pid in ("telegram", "bale", "eitaa", "rubika", "webhook"):
              rule = publish.PLATFORM_RULES[pid]
              assert rule["text"] > 0 and rule["min_interval"] >= 0
          assert publish.PLATFORM_RULES["telegram"]["caption"] == 1024
          assert publish.PLATFORM_RULES["telegram"]["text"] == 4096
          assert publish.PLATFORM_RULES["eitaa"]["photo"] == "upload"
          print("platform rules ok")
          PY

      - name: Import the ASGI app (smoke test)
        env:
          DATA_DIR: ./.ci-data
        run: |
          python - <<'PY'
          from app.main import app
          from app import scheduler
          routes = {r.path for r in app.routes}
          for path in ("/healthz", "/api/feeds", "/api/jobs", "/api/dashboard"):
              assert path in routes, f"missing route {path}"
          # scheduler logic must be pure and predictable
          job = {"enabled": 1, "schedule_times": '["08:00","20:30"]', "interval_minutes": 0, "last_run": ""}
          assert scheduler.parse_times(job["schedule_times"]) == [(8, 0), (20, 30)]
          assert scheduler.next_run(job) is not None
          print("smoke test ok")
          PY

  source-deploy-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Test source runtime startup with a custom port and writable data directory
        run: |
          set -eu
          export DATA_DIR="$(mktemp -d)/rozaneh" PORT=19099 SCHEDULER_ENABLED=0
          uvicorn main:app --host 0.0.0.0 --port "$PORT" > /tmp/rozaneh-source.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/rozaneh-source.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz"; then
              test -f "$DATA_DIR/rozaneh.db"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          echo 'Source deployment did not become healthy' >&2
          exit 1

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t rozaneh:ci .
      - name: Check non-root startup, custom port and health endpoint
        run: |
          set -eu
          docker run -d --name rozaneh-ci -e PORT=9090 -e SCHEDULER_ENABLED=0 -p 127.0.0.1:9090:9090 rozaneh:ci
          trap 'docker logs rozaneh-ci; docker rm -f rozaneh-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/healthz; then
              docker exec rozaneh-ci sh -c 'test "$(id -u)" = 10001 && command -v ffmpeg && command -v ffprobe'
              exit 0
            fi
            sleep 2
          done
          echo 'Application did not become healthy' >&2
          exit 1
